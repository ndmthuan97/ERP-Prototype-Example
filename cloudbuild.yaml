# ============================================================
# Cloud Build — CD step: tạo 8 Cloud Deploy release (1/service, song song)
# ============================================================
# CI (GitHub Actions) build + push image → deploy.yml submit build này → Cloud
# Build tạo 8 release (mỗi service 1 pipeline) → Cloud Deploy render+rollout.
#
#   CI (GH Actions)  →  CD (Cloud Build)  →  Cloud Deploy (8 pipeline)  →  Cloud Run
#
# Vì cloudrun deployer chỉ nhận 1 service/pipeline, mỗi bước tạo release cho 1
# pipeline erp-<service>, source = deploy/<service>/ (skaffold + service.yaml),
# image trỏ tag `_TAG` (mặc định latest → Cloud Deploy resolve digest lúc render,
# ghim lại → rollback đúng digest). Các bước chạy SONG SONG (waitFor ['-']).
# Cùng tên release `_RELEASE` ở 8 pipeline khác nhau là hợp lệ (khác namespace).
# ============================================================

steps:
  - id: release-api-gateway
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-api-gateway, --region=us-central1,
           --source=deploy/api-gateway,
           '--images=api-gateway=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/api-gateway:${_TAG}']

  - id: release-auth-service
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-auth-service, --region=us-central1,
           --source=deploy/auth-service,
           '--images=auth-service=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/auth-service:${_TAG}']

  - id: release-customer-service
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-customer-service, --region=us-central1,
           --source=deploy/customer-service,
           '--images=customer-service=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/customer-service:${_TAG}']

  - id: release-sales-service
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-sales-service, --region=us-central1,
           --source=deploy/sales-service,
           '--images=sales-service=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/sales-service:${_TAG}']

  - id: release-inventory-service
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-inventory-service, --region=us-central1,
           --source=deploy/inventory-service,
           '--images=inventory-service=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/inventory-service:${_TAG}']

  - id: release-catalog-service
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-catalog-service, --region=us-central1,
           --source=deploy/catalog-service,
           '--images=catalog-service=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/catalog-service:${_TAG}']

  - id: release-purchasing-service
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-purchasing-service, --region=us-central1,
           --source=deploy/purchasing-service,
           '--images=purchasing-service=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/purchasing-service:${_TAG}']

  - id: release-frontend
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['-']
    args: [deploy, releases, create, '${_RELEASE}',
           --delivery-pipeline=erp-frontend, --region=us-central1,
           --source=deploy/frontend,
           '--images=frontend=us-central1-docker.pkg.dev/$PROJECT_ID/erp-services/frontend:${_TAG}']

substitutions:
  _TAG: latest
  _RELEASE: rel-manual

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
